[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trafficvision-ai"
version = "0.1.0"
description = "CPU-compatible vehicle detection and traffic analytics foundation."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = {text = "AGPL-3.0-only"}
authors = [{name = "TrafficVision AI contributors"}]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["config*", "models*", "core*", "visualization*", "analytics*", "database*", "dashboard*", "utils*"]
